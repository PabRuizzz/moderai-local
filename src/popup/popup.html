<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ModerAI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="cabecera">
      <h1>ModerAI</h1>
      <img src="../brand/ojo.png" alt="">
    </header>
    <div class="contenido">
      <p id="estadoCuentaPopup" role="status"></p>
      <dl class="resumen">
        <div><dt>Reglas activas</dt><dd id="reglasActivas">0</dd></div>
        <div><dt id="bloqueosTitulo">Bloqueos hoy</dt><dd id="bloqueosHoy">0</dd></div>
      </dl>
      <section class="sens">
        <div class="fila"><label for="nivel">Umbral de certeza</label><output for="nivel" id="nivelVal">70%</output></div>
        <input type="range" id="nivel" min="20" max="95" step="1" value="70" aria-describedby="nivelAyuda">
        <p id="nivelAyuda">Se difuminan los posts con esa certeza del modelo o más.</p>
      </section>
      <section aria-labelledby="tituloReglas">
        <h2 id="tituloReglas">Reglas activas</h2>
        <ul id="listaReglasRapida"><li class="vacio">Aún no has creado reglas.</li></ul>
      </section>
    </div>
    <footer><button id="btnGestionarReglas">Gestionar reglas <span aria-hidden="true">↗</span></button></footer>
  </main>
  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
